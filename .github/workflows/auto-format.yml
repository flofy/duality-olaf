name: Auto-format

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    uses: flofy/pwa-kit/.github/workflows/auto-format.yml@main
    with:
      node-version: "24"
      pnpm-version: "10.15.0"
      install-command: pnpm install --no-frozen-lockfile
      format-command: pnpm fmt
