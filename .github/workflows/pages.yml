name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: flofy/pwa-kit/.github/workflows/deploy-pages.yml@main
    with:
      node-version: "24"
      pnpm-version: "10.15.0"
      install-command: pnpm install --no-frozen-lockfile
      build-command: VITE_BASE_PATH=/duality-olaf/ pnpm build && cp apps/web/dist/index.html apps/web/dist/404.html
      artifact-path: apps/web/dist
      working-directory: .
