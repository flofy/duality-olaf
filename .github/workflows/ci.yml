name: Quality Checks
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Run Knip
        run: pnpm knip

      - name: Run Madge
        run: pnpm madge

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Run Snyk
        run: pnpm snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}