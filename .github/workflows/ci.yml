name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    uses: flofy/pwa-kit/.github/workflows/quality-checks.yml@main
    with:
      node-version: "24"
      pnpm-version: "10.15.0"
      install-command: pnpm install --no-frozen-lockfile
      checks-command: |
        pnpm knip
        pnpm test:coverage
        pnpm typecheck
        pnpm test
        pnpm build
