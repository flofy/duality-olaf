name: End-to-end

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Le projet `mobile` (viewport + tactile) tourne aussi : les deux projets
      # de playwright.config.ts utilisent Chromium.
      - name: Install Playwright browsers
        run: pnpm --filter @duality/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm --filter @duality/web test:e2e

      # Traces et captures des tests en échec (trace: on-first-retry).
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
